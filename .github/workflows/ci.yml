name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Gerar fixture de testes
        run: python tests/fixtures/create_test_workbook.py
      - name: Rodar testes
        run: python -m pytest tests/ -q --tb=short
