<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Executive Audit Report — EXRS Data Oracle</title>
<style>
  :root{
    --bg:#faf9f7; --ink:#26241f; --ink-soft:#6b675e; --line:#e4e1da;
    --card:#ffffff; --red:#b3261e; --red-soft:#fbeae9;
    --green:#2c6e49; --fake-green:#9dbfa9;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--ink);
    font-family:Georgia,'Times New Roman',serif;-webkit-font-smoothing:antialiased;}
  .sans{font-family:'Segoe UI',Helvetica,Arial,sans-serif;}
  .wrap{max-width:1040px;margin:0 auto;padding:0 48px;}

  /* Cada ato é uma "tela": um achado por tela (Spec §6) */
  section.act{min-height:96vh;padding:56px 0 64px;border-bottom:1px solid var(--line);}
  .masthead{display:flex;justify-content:space-between;align-items:baseline;
    border-bottom:3px solid var(--ink);padding-bottom:14px;}
  .masthead h1{font-size:14px;letter-spacing:.22em;text-transform:uppercase;font-weight:600;}
  .masthead .meta{font-size:12px;color:var(--ink-soft);letter-spacing:.06em;}
  .kicker{margin-top:34px;font-size:12px;letter-spacing:.28em;text-transform:uppercase;color:var(--ink-soft);}

  .money-hero{font-size:clamp(60px,9vw,112px);font-weight:700;line-height:1;letter-spacing:-.02em;}
  .money-hero .bleed{color:var(--red);}
  .headline{margin-top:18px;font-size:clamp(24px,3.2vw,34px);line-height:1.28;font-weight:400;max-width:21em;}
  .headline .bleed{color:var(--red);font-weight:700;}
  .sub{margin-top:16px;font-size:16.5px;line-height:1.62;color:var(--ink-soft);max-width:46em;}
  .sub strong{color:var(--ink);}
  .composition{margin-top:24px;font-size:12.5px;color:var(--ink-soft);
    border-left:2px solid var(--line);padding-left:14px;line-height:1.7;max-width:52em;}
  .composition em{font-style:normal;color:var(--ink);}

  .cards{margin-top:48px;display:grid;grid-template-columns:repeat(3,1fr);gap:20px;}
  @media(max-width:820px){.cards{grid-template-columns:1fr;}}
  .card{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--red);
    padding:26px 24px 22px;display:flex;flex-direction:column;min-height:260px;}
  .card .tag{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-soft);}
  .card .value{margin-top:12px;font-size:36px;font-weight:700;color:var(--red);}
  .card .cause{margin-top:12px;font-size:15px;line-height:1.55;flex:1;}
  .card .fact{margin-top:12px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);}
  .card a{margin-top:8px;font-size:13px;font-weight:600;color:var(--ink);text-decoration:none;}
  .card a::after{content:" →";}

  .chapter-num{margin-top:32px;font-size:clamp(46px,7vw,84px);font-weight:700;letter-spacing:-.02em;}
  .chapter-num.bleed{color:var(--red);}
  .chartbox{margin-top:38px;background:var(--card);border:1px solid var(--line);padding:38px 40px 28px;}
  .evidence{margin-top:30px;display:flex;gap:18px;flex-wrap:wrap;}
  .ev{flex:1;min-width:240px;background:var(--card);border:1px solid var(--line);padding:20px 22px;}
  .ev .tag{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-soft);}
  .ev p{margin-top:10px;font-size:14.5px;line-height:1.58;}
  .cost-line{margin-top:28px;font-size:15.5px;line-height:1.6;max-width:46em;}
  .cost-line b{color:var(--red);}
  .hookband{margin-top:26px;padding:18px 22px;background:var(--card);
    border:1px solid var(--line);border-left:4px solid var(--ink);
    font-size:14.5px;line-height:1.6;max-width:52em;}

  /* Treemap (flex proporcional) */
  .treemap{display:flex;flex-wrap:wrap;gap:6px;min-height:230px;}
  .treemap .cell{background:var(--red);color:#fff;display:flex;flex-direction:column;
    justify-content:flex-end;padding:12px;font-size:12.5px;min-width:90px;}
  .treemap .cell.agg{background:var(--red-soft);color:var(--ink);border:1px dashed var(--red);}
  .treemap .cell b{font-size:16px;}

  /* Barras / série */
  .bars{display:flex;align-items:flex-end;gap:10px;height:220px;}
  .bars .b{flex:1;background:var(--red);opacity:.9;position:relative;}
  .bars .b span{position:absolute;bottom:100%;left:0;right:0;text-align:center;
    font-size:11px;color:var(--ink-soft);margin-bottom:6px;}
  .axis-note{margin-top:14px;font-size:12px;color:var(--ink-soft);}

  /* Waterfall */
  .wf{position:relative;height:340px;}
  .wf .baseline{position:absolute;left:0;right:0;border-top:1px dashed #c9c5bc;}
  .wf .zero{position:absolute;right:0;top:-18px;font-size:11px;color:var(--ink-soft);}
  .wf .col{position:absolute;width:20%;}
  .wf .bar{position:absolute;left:0;right:0;}
  .wf .blab{position:absolute;left:0;right:0;text-align:center;font-weight:700;font-size:18px;}
  .wf .clab{position:absolute;left:0;right:0;text-align:center;font-size:13px;
    color:var(--ink-soft);line-height:1.4;}
  .wf .clab b{display:block;color:var(--ink);font-size:14px;}

  /* Honestidade */
  .honesty-list{margin-top:36px;display:grid;gap:14px;max-width:52em;}
  .hn{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--green);
    padding:18px 22px;font-size:14.5px;line-height:1.6;}
  .hn b{color:var(--green);}

  /* Plano */
  .plan{margin-top:36px;display:grid;gap:14px;max-width:56em;}
  .pl{background:var(--card);border:1px solid var(--line);padding:20px 24px;
    display:flex;gap:20px;align-items:baseline;}
  .pl .rank{font-size:26px;font-weight:700;color:var(--ink-soft);min-width:38px;}
  .pl .body{flex:1;}
  .pl .body b{font-size:16px;}
  .pl .body p{margin-top:6px;font-size:14px;line-height:1.55;color:var(--ink-soft);}
  .pl .impact{font-size:18px;font-weight:700;white-space:nowrap;}
  .pl.scenario{border-style:dashed;}
  .pl.scenario .impact::after{content:" (cenário)";font-size:11px;color:var(--ink-soft);font-weight:400;}

  .footerband{margin-top:48px;padding-top:24px;border-top:1px solid var(--line);
    display:flex;justify-content:space-between;align-items:center;gap:30px;flex-wrap:wrap;}
  .prov{font-size:11px;color:var(--ink-soft);letter-spacing:.04em;max-width:40em;line-height:1.6;}
  .cta{font-size:14px;white-space:nowrap;color:var(--ink);text-decoration:none;
    border:1px solid var(--ink);padding:12px 22px;letter-spacing:.04em;}

  /* Ato 6 — Anexo de Evidências (Spec v4 §16). Neutro de propósito: o vermelho já
     gritou no corpo (§4.2, moeda escassa) — aqui é prova, não drama. */
  .anexo-link{display:inline-block;margin-top:10px;font-size:12px;color:var(--ink-soft);
    text-decoration:underline;text-underline-offset:3px;}
  .anexo-section{margin-top:20px;background:var(--card);border:1px solid var(--line);}
  .anexo-section + .anexo-section{margin-top:14px;}
  .anexo-section summary{padding:18px 22px;cursor:pointer;font-weight:600;font-size:15px;
    display:flex;justify-content:space-between;align-items:center;list-style:none;gap:12px;}
  .anexo-section summary::-webkit-details-marker{display:none;}
  .anexo-section summary::after{content:'+ expandir';font-size:11px;font-weight:400;
    letter-spacing:.04em;text-transform:uppercase;color:var(--ink-soft);white-space:nowrap;}
  .anexo-section[open] summary::after{content:'– recolher';}
  .anexo-section summary .meta{font-size:12.5px;color:var(--ink-soft);font-weight:400;}
  .anexo-table-wrap{overflow-x:auto;}
  .anexo-table{width:100%;border-collapse:collapse;font-size:12.5px;white-space:nowrap;}
  .anexo-table th{text-align:left;font-size:10px;letter-spacing:.06em;text-transform:uppercase;
    color:var(--ink-soft);padding:8px 16px;border-top:1px solid var(--line);white-space:nowrap;}
  .anexo-table td{padding:10px 16px;border-top:1px solid var(--line);vertical-align:top;
    white-space:normal;}
  .anexo-table td.src{font-family:'Courier New',monospace;font-size:10.5px;
    color:var(--ink-soft);white-space:nowrap;}
  .anexo-table td.neg{color:var(--red);}
  .anexo-note{margin-top:2px;font-size:11px;color:var(--green);}
  .anexo-meta-line{margin-top:2px;font-size:11px;color:var(--ink-soft);}
  .anexo-legend{padding:14px 22px;font-size:11.5px;color:var(--ink-soft);border-top:1px solid var(--line);}
  .anexo-flags{display:flex;gap:4px;flex-wrap:wrap;}
  .anexo-flag{font-size:9.5px;padding:2px 7px;background:var(--red-soft);color:var(--red);
    text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;}
</style>

<script>
/* ================================================================
   MOTOR DE RENDERIZAÇÃO — NÃO EDITAR POR RODADA (Spec §13).
   Lê AUDIT_DATA e monta o deck. Alturas de gráfico são CALCULADAS
   dos valores (Spec §4.4) — nunca hard-coded.
   ================================================================ */
const D = JSON.parse(document.getElementById('AUDIT_DATA').textContent);
const app = document.getElementById('app');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// Compartilhados por Ato 6 (anexo) e Ato 7 (team) — ambos são formatação pura de
// dado já conferido a montante (Zero Contradição), nunca cálculo aqui.
const brlCents = n => (n == null) ? '—' :
  'R$ ' + Number(n).toLocaleString('pt-BR', {minimumFractionDigits: 2, maximumFractionDigits: 2});
const pct = n => (n == null) ? '—' : Number(n).toFixed(1).replace('.', ',') + '%';
const pp = n => (n == null) ? '—' : Number(n).toFixed(1).replace('.', ',') + 'pp';
const mast = sub => `<header class="masthead sans"><h1>EXRS Data Oracle · Executive Audit Report</h1>
  <div class="meta">${esc(D.cliente)} — Rodada ${esc(D.rodada)} · ${esc(sub)}</div></header>`;
const foot = () => `<footer class="footerband sans"><p class="prov">${esc(D.procedencia)}</p>
  <a class="cta" href="#plano">${esc(D.cta)}</a></footer>`;
const brl = n => 'R$ ' + Math.abs(n).toLocaleString('pt-BR', {maximumFractionDigits: 0});

/* ---------- ATO 1 — O SOCO ---------- */
app.insertAdjacentHTML('beforeend', `
<section class="act" id="ato1">
  ${mast('dados verificados linha a linha')}
  <p class="kicker sans">Sumário executivo</p>
  <div class="money-hero sans" style="margin-top:16px;"><span class="bleed">${esc(D.manchete.total_risco_display)}</span></div>
  <h2 class="headline">${esc(D.manchete.frase)}</h2>
  <p class="composition sans"><em>Composição do total (fatos medidos):</em> ${esc(D.manchete.composicao)}</p>
  <div class="cards sans">
    ${D.sangramentos.map((s,i)=>`
      <article class="card">
        <div class="tag">Sangramento 0${i+1}</div>
        <div class="value">${esc(s.valor_display)}</div>
        <p class="cause">${esc(s.soco)}</p>
        <div class="fact">Fato medido</div>
        <a href="#${esc(s.id)}">Capítulo: ${esc(s.titulo)}</a>
        ${s.anexo_ref && D.anexo ? `<a class="anexo-link" href="#anexo-${esc(s.anexo_ref)}">ver evidências no anexo ↓</a>` : ''}
      </article>`).join('')}
  </div>
  ${foot()}
</section>`);

/* ---------- ATO 2 — O PARADOXO (waterfall calculado) ----------
   O mecanismo mais comum é máscara produto×serviço (v3: L7-Oeste) — mas o
   waterfall é, na essência, uma identidade aditiva de 3 números reais
   (esquerda + meio = direita), não um conceito fixo de "produto/serviço".
   Rótulos e narrativa são PARAMETRIZÁVEIS via AUDIT_DATA (defaults =
   texto original da história produto×serviço) para reaproveitar a MESMA
   estrutura visual em qualquer identidade aditiva real — nunca force um
   dado numa história que ele não sustenta (Spec v4 §1.5), generalize o
   rótulo em vez de inventar um paradoxo. Ver Spec v4 §13.6. */
(() => {
  const P = D.paradoxo;
  const col1Label = P.col1_label ?? 'Produto';
  const col1Context = P.col1_context ?? 'o que a loja vende';
  const col2Label = P.col2_label ?? 'Serviço';
  const col2Context = P.col2_context ?? 'o que paga a conta';
  const col3Label = P.col3_label ?? 'Total que você vê';
  const col3Context = P.col3_context ?? 'o "verde" de mentira';
  const headlineHtml = P.headline_html ??
    'Sua loja campeã <span class="bleed">perde dinheiro em cada produto que vende.</span>';
  const subHtml = P.sub_html ??
    `A ${esc(P.loja)} lidera os seus relatórios. Mas separando <strong>o que ela vende</strong>
     do <strong>que ela conserta</strong> (${esc(P.contexto)}), o produto opera no prejuízo e o serviço
     paga a conta — e esconde o rombo.`;
  const axisNoteHtml = P.axis_note_html ??
    'A barra final é hachurada de propósito: o número é verdadeiro, a saúde é falsa — enquanto o total ' +
    'parecer saudável, o produto sangra sem alarme.';
  const recommendationHtml = P.recommendation_html ??
    'Recompor mix e preço do produto <b>sem enfraquecer o serviço</b> que sustenta a loja — na ordem ' +
    'certa. Esse rebalanceamento é o trabalho de implantação.';
  const controlValueLabel = P.controle.value_label ?? 'produto';
  // 'fake' (default) = hachura diagonal — o total PARECE bom mas esconde o problema
  // (v3: L7-Oeste). 'true' = verde sólido — o total É a verdade boa, escondida por um
  // primeiro número errado (não force a textura de "mentira" numa história onde o
  // resultado final é genuinamente a correção, não a máscara).
  const col3Style = P.col3_style ?? 'fake';
  const col3Background = col3Style === 'true'
    ? 'background:var(--green);opacity:.85;'
    : `background:var(--fake-green);background-image:repeating-linear-gradient(45deg,
       transparent,transparent 8px,rgba(255,255,255,.45) 8px,rgba(255,255,255,.45) 12px);`;

  const H = 340, PAD = 34;                       // área útil do gráfico
  const maxUp = Math.max(P.total, P.servico + P.produto, 0);
  const maxDown = Math.min(P.produto, 0);
  const scale = (H - PAD*2) / (maxUp - maxDown); // px por R$
  const zeroY = PAD + maxUp * scale;
  const y = v => zeroY - v * scale;
  const prodTop = zeroY, prodH = Math.abs(P.produto)*scale;
  const svcTop = y(P.produto + P.servico), svcH = P.servico*scale;
  const totTop = y(P.total), totH = P.total*scale;
  app.insertAdjacentHTML('beforeend', `
<section class="act" id="ato2">
  ${mast('Ato 2 · A causa raiz — ' + P.loja)}
  <p class="kicker sans">O paradoxo</p>
  <h2 class="headline">${headlineHtml}</h2>
  <p class="sub">${subHtml}</p>
  <div class="chartbox sans"><div class="wf">
    <div class="baseline" style="top:${zeroY}px;"><span class="zero">R$ 0</span></div>
    <div class="col" style="left:6%;">
      <div class="bar" style="top:${prodTop}px;height:${prodH}px;background:var(--red);"></div>
      <div class="blab" style="top:${prodTop+prodH+8}px;color:var(--red);">−${brl(P.produto)}</div>
      <div class="clab" style="top:${zeroY+prodH+44}px;"><b>${esc(col1Label)}</b>${esc(col1Context)}</div>
    </div>
    <div class="col" style="left:38%;">
      <div class="bar" style="top:${svcTop}px;height:${svcH}px;background:var(--green);opacity:.85;"></div>
      <div class="blab" style="top:${svcTop-30}px;color:var(--green);">+${brl(P.servico)}</div>
      <div class="clab" style="top:${zeroY+prodH+44}px;"><b>${esc(col2Label)}</b>${esc(col2Context)}</div>
    </div>
    <div class="col" style="left:70%;">
      <div class="bar" style="top:${totTop}px;height:${totH}px;${col3Background}"></div>
      <div class="blab" style="top:${totTop-30}px;color:var(--ink-soft);">+${brl(P.total)}</div>
      <div class="clab" style="top:${zeroY+prodH+44}px;"><b>${esc(col3Label)}</b>${esc(col3Context)}</div>
    </div>
  </div>
  <p class="axis-note" style="margin-top:100px;">${axisNoteHtml}</p>
  </div>
  <div class="evidence sans">
    <div class="ev" style="border-left:4px solid var(--red);">
      <div class="tag">A prova de controle</div>
      <p><b>${esc(P.controle.loja)}</b> ${esc(P.controle.frase)} (${esc(controlValueLabel)} ${P.controle.produto<0?'−':''}${brl(P.controle.produto)})</p>
    </div>
    <div class="ev" style="border-left:4px solid var(--ink);">
      <div class="tag">O que isso pede</div>
      <p>${recommendationHtml}</p>
    </div>
  </div>
  ${foot()}
</section>`);
})();

/* ---------- ATO 3 — OS TRÊS SANGRAMENTOS ---------- */

      chart = `<div class="chartbox sans"><div class="treemap">
        ${shown.map(x=>`<div class="cell" style="flex-grow:${x.valor};"><b>${brl(x.valor)}</b>${esc(x.nome)}</div>`).join('')}

    } else {
      chart = `<div class="chartbox sans"><div class="treemap">
        <div class="cell" style="flex-grow:1;"><b>${esc(s.valor_display)}</b>${s.treemap_total_itens} produtos sem giro — detalhamento por item no anexo</div>
      </div><p class="axis-note">Mapa por produto disponível quando o motor exportar o detalhamento (procedência preservada — nada é estimado aqui).</p></div>`;

  } else if (s.id === 'cap-clientes') {
    if (Array.isArray(s.serie_mensal) && s.serie_mensal.length) {
      const mx = Math.max(...s.serie_mensal.map(m => m.valor));
      chart = `<div class="chartbox sans"><div class="bars">
        ${s.serie_mensal.map(m=>`<div class="b" style="height:${(m.valor/mx)*100}%;"><span>${esc(m.mes)}</span></div>`).join('')}

    } else {
      chart = `<div class="chartbox sans" style="text-align:center;padding:56px 40px;">
        <div class="money-hero" style="font-size:clamp(48px,7vw,84px);"><span class="bleed">${esc(s.valor_display)}</span></div>

        série mensal do gotejamento disponível quando o motor exportar a linha do tempo — nada é estimado aqui.</p>

    chart = `<div class="chartbox sans" style="display:flex;gap:32px;align-items:center;justify-content:center;padding:48px 40px;flex-wrap:wrap;">

      <div style="font-size:30px;color:var(--ink-soft);">→</div>
      <div style="text-align:center;"><div style="font-size:13px;color:var(--ink-soft);">vende por</div>
        <div style="font-size:52px;font-weight:700;">R$ 200</div></div>
      <div style="font-size:30px;color:var(--ink-soft);">=</div>
      <div style="text-align:center;"><div style="font-size:13px;color:var(--red);">depois do custo de operar</div>
        <div style="font-size:52px;font-weight:700;color:var(--red);">prejuízo</div></div>
    </div>`;
  }
  app.insertAdjacentHTML('beforeend', `
<section class="act" id="${esc(s.id)}">
  ${mast('Capítulo ' + (i+1) + ' de 3 · ' + s.titulo)}
  <p class="kicker sans">Sangramento 0${i+1} — ${esc(s.titulo)}</p>
  <div class="chapter-num sans bleed">${esc(s.valor_display)}</div>
